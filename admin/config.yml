# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Redaktion TSV Hessental (Sveltia CMS) – erreichbar unter https://tsv-hessental.de/admin/
# Speichern im CMS = Commit auf main -> GitHub Action „Upload zu Strato“ -> nach ca. 1–2 Minuten live.
# Anleitung für Redakteure: REDAKTION.md

backend:
  name: github
  repo: jannelrnzn/tsv_hessental_testwebsite
  branch: main
  # Anmelden mit GitHub über den Login-Dienst von JL Webservice (Cloudflare Worker sveltia-cms-auth)
  base_url: https://sveltia-cms-auth.jl-webservice.workers.dev
  commit_messages:
    create: "Mitteilung neu: {{slug}}"
    update: "Mitteilung geändert: {{slug}}"
    delete: "Mitteilung gelöscht: {{slug}}"
    uploadMedia: "Bild hochgeladen: {{path}}"
    deleteMedia: "Bild gelöscht: {{path}}"

site_url: https://tsv-hessental.de
display_url: https://tsv-hessental.de
logo:
  src: /assets/images/logo/vereinslogo-100x121.png

media_folder: /assets/images/mitteilungen
public_folder: /assets/images/mitteilungen

media_libraries:
  all:
    # Dateinamen ohne Leerzeichen/Umlaute („Foto Spiel.jpg“ -> foto-spiel.webp)
    slugify_filename: true
  default:
    config:
      max_file_size: 26214400 # 25 MB
      # Handyfotos beim Hochladen automatisch verkleinern (max. 2400 px, WebP)
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: mitteilungen
    label: Mitteilungen & Spielberichte
    label_singular: Mitteilung
    description: >-
      Neueste zuerst. Die drei neuesten Mitteilungen und Spielberichte erscheinen auf der Startseite,
      alle unter Archiv → Mitteilungen.
    folder: content/mitteilungen
    extension: md
    format: frontmatter
    create: true
    delete: true
    # Dateiname = Adresse der Seite (mitteilungen/<datum>-<stichwort>.html), wird beim ersten Speichern festgelegt
    slug: "{{datum}}-{{stichwort}}"
    identifier_field: titel
    # In der Liste: Datum · Überschrift – zuletzt geändert wann und von wem (aus der GitHub-Historie)
    summary: "{{datum | date('DD.MM.YYYY')}} · {{titel}} – geändert {{commit_date | date('DD.MM.YYYY, HH:mm')}} Uhr von {{commit_author}}"
    preview_path: mitteilungen/{{slug}}.html
    sortable_fields:
      fields: [datum, titel, commit_date, commit_author]
      default:
        field: datum
        direction: descending
    view_filters:
      - label: Mitteilungen
        field: kategorie
        pattern: mitteilung
      - label: Spielberichte
        field: kategorie
        pattern: spielbericht
    fields:
      - name: titel
        label: Überschrift
        widget: string
      - name: datum
        label: Datum
        widget: datetime
        type: date
        default: "{{now}}"
      - name: kategorie
        label: Art
        widget: select
        default: mitteilung
        options:
          - { label: Mitteilung, value: mitteilung }
          - { label: Spielbericht, value: spielbericht }
      - name: stichwort
        label: Stichwort für die Adresse
        hint: >-
          Kurz, nur Kleinbuchstaben und Bindestriche, z. B. „besenausfahrt“. Ergibt die Adresse
          tsv-hessental.de/mitteilungen/JJJJ-MM-TT-besenausfahrt.html und lässt sich danach nicht mehr ändern.
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Nur Kleinbuchstaben (a–z), Ziffern und Bindestriche, keine Umlaute"]
      - name: bilder
        label: Bilder
        label_singular: Bild
        hint: Das erste Bild erscheint groß nach dem ersten Absatz und als Vorschaubild, weitere als Raster am Ende.
        widget: list
        required: false
        collapsed: false
        fields:
          - name: datei
            label: Bild
            widget: image
            choose_url: false
          - name: beschreibung
            label: Bildunterschrift
            widget: string
            required: false
      - name: body
        label: Text
        hint: >-
          Enter = neuer Absatz, Umschalt+Enter = neue Zeile. Links auf eigene Seiten ohne Domain,
          z. B. vorstand.html.
        widget: richtext
        buttons: [bold, italic, link, bulleted-list, numbered-list]
        editor_components: [image, table]
      - name: teaser
        label: Kurztext für Startseite (optional)
        hint: Ohne Eingabe werden automatisch die ersten Zeilen des Textes verwendet.
        widget: text
        required: false
      - name: archiv
        label: Nicht mehr auf der Startseite zeigen (nur noch im Archiv)
        widget: boolean
        required: false
        default: false
      - name: datum_text
        label: Abweichende Datumsanzeige (optional)
        hint: Nur nötig, wenn statt des Datums z. B. „April 2026“ stehen soll.
        widget: string
        required: false
